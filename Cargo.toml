[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# vitrify-core and vitrify-cli are released together, at one version: bump it
# here and in the `vitrify-core` requirement below in the same change.
version = "0.8.0"
edition = "2024"
# the oldest rustc that builds the published crates (File::lock is 1.89);
# CI's msrv job holds it. Development uses rust-toolchain.toml's pin.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/bitshock-src/vitrify"

[workspace.dependencies]
# exact: vitrify-core is vitrify-cli's internal library, with no API held
# across releases, so each vitrify-cli release builds against its own
vitrify-core = { path = "crates/vitrify-core", version = "=0.8.0" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
sha2 = "0.11"
thiserror = "2.0"
anyhow = "1.0"
fs-err = "3.3"
assert_cmd = "2.2"
predicates = "3.1"
insta = "1.49"
tempfile = "3.27"
